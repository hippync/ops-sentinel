spring:
  application:
    name: orders-sandbox
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/orders}
    username: ${DB_USER:orders}
    password: ${DB_PASSWORD:orders}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        # Actuator is for local debugging only. Ops Sentinel reads state via
        # CloudWatch, never via actuator calls.
        include: health,info

server:
  port: 8080

opssentinel:
  chaos:
    # Fails closed: with enabled=true and a blank or short key the app refuses to boot.
    # See ChaosProperties. Never commit a real value.
    enabled: ${CHAOS_ENABLED:false}
    admin-api-key: ${CHAOS_ADMIN_API_KEY:}
