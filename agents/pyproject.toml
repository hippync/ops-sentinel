[project]
name = "ops-sentinel"
version = "0.1.0"
description = "Multi-agent AI-SRE pipeline with a deterministic safety gate"
requires-python = ">=3.12"
dependencies = [
    # Upper bounds are deliberate: LangGraph 0.x ships breaking changes between
    # minor versions and there is a fixed December demo. A broken `pip install`
    # in week 14 is a plausible way to lose the project.
    "langgraph>=0.2,<0.7",
    "langchain-anthropic>=0.3,<0.4",
    "pydantic>=2.9,<3",
    "boto3>=1.35,<2",
    "structlog>=24.4,<26",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.7", "mypy>=1.13", "moto>=5.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ops_sentinel"]

[tool.hatch.build.targets.wheel.force-include]
"src/ops_sentinel/py.typed" = "ops_sentinel/py.typed"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# S101: bare asserts are how pytest works. Bandit rules stay on for src/.
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
