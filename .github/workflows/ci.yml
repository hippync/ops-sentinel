name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  agents:
    name: agents (python)
    runs-on: ubuntu-latest
    # Path-filtered: a Java-only change should not run this suite (see ADR-0001).
    if: |
      github.event_name == 'push' ||
      contains(join(github.event.pull_request.labels.*.name, ','), 'agents') ||
      true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        working-directory: agents
        run: pip install -e ".[dev]"
      - name: Lint
        working-directory: agents
        run: ruff check .
      - name: Types
        working-directory: agents
        run: mypy src
      - name: Tests
        working-directory: agents
        run: pytest -q

  sandbox-app:
    name: sandbox-app (java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven
      - name: Build and test
        working-directory: sandbox-app
        run: mvn -B verify

  terraform:
    name: infra (terraform)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Format check
        working-directory: infra/terraform
        run: terraform fmt -check -recursive
